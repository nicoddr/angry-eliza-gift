<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#09131D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Angry Elīza — A Christmas Gift</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./style.css" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body data-state="loading">
  <canvas id="webgl-canvas" aria-label="Interactive 3D Christmas Gift and Painting"></canvas>

  <!-- Initial Loading Overlay -->
  <div id="loader" class="overlay-layer" role="status" aria-live="polite">
    <div class="loader-inner">
      <div class="loader-ring" aria-hidden="true"></div>
      <p class="loader-text">Preparing your gift…</p>
    </div>
  </div>

  <!-- Closed Gift UI -->
  <div id="gift-ui" class="overlay-layer">
    <div class="gift-cta-wrap">
      <button id="btn-open" class="btn-primary" type="button">Open</button>
    </div>
  </div>

  <!-- Top Utility Bar (Gallery & Details) -->
  <header id="top-bar" class="overlay-layer">
    <div class="top-bar-inner">
      <div class="top-left">
        <span id="tour-progress" class="pill-badge" aria-live="polite">1 / 9</span>
      </div>
      <div class="top-right">
        <button
          id="btn-flip"
          class="btn-icon-pill"
          type="button"
          title="Flip painting front and back"
          aria-label="Flip painting to see the back"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          <span>Flip</span>
        </button>

        <button
          id="btn-lang"
          class="btn-icon-pill btn-lang-pill"
          type="button"
          title="Switch detail language (English / Français)"
          aria-label="Toggle language between English and French"
        >
          EN
        </button>

        <button
          id="btn-close-details"
          class="btn-circle"
          type="button"
          title="Return to free view"
          aria-label="Close detail tour and return to free view"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Gallery / Free View UI -->
  <section id="gallery-ui" class="overlay-layer" aria-label="Painting plaque and controls">
    <div class="gallery-bottom">
      <p id="touch-hint" class="touch-hint">Drag to rotate · Pinch to zoom · Turn to see the back</p>

      <div class="plaque">
        <h1 class="painting-title">Title: Angry Elīza</h1>
        <p class="painting-artist">Artist : Nicolas DIDIER</p>
      </div>

      <button id="btn-details" class="btn-primary" type="button">See Details</button>
    </div>
  </section>

  <!-- Guided Detail Tour UI -->
  <section id="detail-ui" class="overlay-layer" aria-label="Painting details tour">
    <div class="detail-card" role="region" aria-live="polite">
      <div class="detail-card-body">
        <h2 id="detail-title" class="detail-title"></h2>
        <p id="detail-text" class="detail-text"></p>
      </div>

      <div class="detail-card-footer">
        <button
          id="btn-prev"
          class="btn-circle"
          type="button"
          title="Previous detail"
          aria-label="Previous detail"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5" />
            <path d="m12 19-7-7 7-7" />
          </svg>
        </button>

        <div id="detail-dots" class="detail-dots" aria-hidden="true"></div>

        <button id="btn-next" class="btn-primary btn-next" type="button">Next</button>
      </div>
    </div>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
